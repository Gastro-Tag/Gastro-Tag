# Porta 8080: acesso direto (navegador do notebook e aparelhos da rede local), publicada como 80
# no host. O IP do cliente é o da conexão; um CF-Connecting-IP enviado pelo cliente é ignorado.
server {
    # nginx-unprivileged: sem root, porta 8080 dentro do container.
    listen 8080;
    server_name _;
    include /etc/nginx/gastrotag/site.conf;
}

# Porta 8081: só para o túnel (serviço "tunel" do docker-compose.yml, perfil "tunel").
# NÃO é publicada no host: só containers da rede interna do Compose chegam aqui.
# O cloudflared repassa o IP do visitante em CF-Connecting-IP; o módulo realip troca o
# $remote_addr por ele (a API recebe o IP real em X-Forwarded-For e conta o limite de login
# por visitante). Origens confiáveis: faixas privadas, onde ficam as redes do Docker.
server {
    listen 8081;
    server_name _;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    include /etc/nginx/gastrotag/site.conf;
}
