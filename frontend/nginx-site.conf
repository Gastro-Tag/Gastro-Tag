# Configuração comum aos dois server do nginx.conf (8080: rede local; 8081: túnel).
# Incluída dentro de cada bloco server; não é carregada sozinha (fica fora de conf.d).

root /usr/share/nginx/html;
index index.html;

server_tokens off;

# Limite de corpo: 1 MB (a API recusa JSON acima de 100 KB com 413 próprio).
client_max_body_size 1m;

# Os add_header dos blocos location somam-se aos daqui (nginx >= 1.29.3).
add_header_inherit merge;

# Headers de segurança (também nas respostas de erro).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP: scripts só do próprio site (o build do Vite não gera script inline);
# 'unsafe-inline' em style-src é necessário para os atributos style da etiqueta impressa
# (utils/printLabel.ts); fontes servidas localmente (@fontsource, empacotadas pelo Vite); logo em data: URL.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Gzip
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/csv application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

# index.html sempre revalidado, para o navegador pegar os novos /assets após uma atualização.
location = /index.html {
    add_header Cache-Control "no-cache" always;
}

# Arquivos do build com hash no nome: cache longo e imutável.
location /assets/ {
    try_files $uri =404;
    # Sem "always": um 404 de asset não pode ficar em cache por 1 ano.
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# SPA fallback — todas as rotas apontam para index.html (sem cache).
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}

# Proxy da API (containers na mesma rede)
# As respostas da API já trazem os headers de segurança do helmet; não duplicar aqui.
location /api/ {
    add_header_inherit off;
    client_max_body_size 1m;
    proxy_pass         http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    # Sobrescreve o valor enviado pelo cliente para impedir IP forjado. Na porta 8081 (túnel),
    # $remote_addr já é o IP do visitante informado pela Cloudflare (CF-Connecting-IP).
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_hide_header  X-Powered-By;
}
