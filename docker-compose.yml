# Logs dos containers limitados a ~30 MB por serviço (3 arquivos de 10 MB, rotação pelo Docker).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16.16-alpine3.24
    container_name: gastrotag_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gastrotag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-gastrotag}
      TZ: America/Manaus
      KITCHEN_TIME_ZONE: ${KITCHEN_TIME_ZONE:-America/Manaus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gastrotag} -d ${POSTGRES_DB:-gastrotag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gastrotag_api
    restart: unless-stopped
    logging: *default-logging
    # A API encerra sozinha em até 10 s após o SIGTERM (desligamento gracioso).
    stop_grace_period: 15s
    environment:
      NODE_ENV: production
      PORT: 3333
      TZ: America/Manaus
      KITCHEN_TIME_ZONE: ${KITCHEN_TIME_ZONE:-America/Manaus}
      CAP_DISCARD_TO_ORIGINAL_EXPIRY: ${CAP_DISCARD_TO_ORIGINAL_EXPIRY:-true}
      TRUST_PROXY_HOPS: 1
      DATABASE_URL: postgresql://${POSTGRES_USER:-gastrotag}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:-gastrotag}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Defina JWT_ACCESS_SECRET no arquivo .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Defina JWT_REFRESH_SECRET no arquivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SYNC_ON_BOOT: ${ADMIN_SYNC_ON_BOOT:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      MAX_BACKDATE_DAYS: ${MAX_BACKDATE_DAYS:-2}
    depends_on:
      db:
        condition: service_healthy
    # /health confere o banco. start_period cobre o "prisma migrate deploy" antes de a API subir.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    container_name: gastrotag_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # nginx sem root escuta 8080 no container; no host continua a porta 80.
    ports:
      - "80:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Túnel gratuito da Cloudflare (quick tunnel: sem conta, sem token) com link HTTPS público
  # *.trycloudflare.com. Fica no perfil "tunel": NÃO sobe no "docker compose up" normal.
  # Ligar/desligar: ./scripts/tunel.sh e ./scripts/tunel.sh parar (guia no README).
  # Aponta para a porta 8081 do frontend (só na rede interna), que confia no CF-Connecting-IP.
  # Sem "restart": depois de reiniciar o notebook ou o Docker, o túnel continua desligado.
  tunel:
    image: cloudflare/cloudflared:2026.10.7
    container_name: gastrotag_tunel
    profiles: ["tunel"]
    logging: *default-logging
    command: tunnel --no-autoupdate --url http://frontend:8081
    depends_on:
      frontend:
        condition: service_healthy

  # Backup diário (pg_dump -Fc) no volume backups_data; um dump ao subir; mantém os últimos
  # BACKUP_RETENCAO. Guia em scripts/README.md. A senha vai só por PGPASSWORD (ambiente).
  backup:
    image: postgres:16.16-alpine3.24
    container_name: gastrotag_backup
    restart: unless-stopped
    logging: *default-logging
    # Dá tempo de um dump em andamento terminar antes do SIGKILL.
    stop_grace_period: 60s
    # tr remove um eventual CR (checkout com fim de linha do Windows) antes de executar.
    entrypoint: ["sh", "-c", "tr -d '\\r' < /scripts/backup-postgres.sh > /tmp/backup-postgres.sh && exec sh /tmp/backup-postgres.sh loop"]
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-gastrotag}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      PGDATABASE: ${POSTGRES_DB:-gastrotag}
      TZ: America/Manaus
      BACKUP_DIR: /backups
      BACKUP_HORARIO: ${BACKUP_HORARIO:-03:00}
      BACKUP_RETENCAO: ${BACKUP_RETENCAO:-14}
    volumes:
      - backups_data:/backups
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  backups_data:
