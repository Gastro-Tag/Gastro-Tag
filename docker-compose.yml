version: '3.9'

services:
  # ── PostgreSQL ───────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: gastrotag_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gastrotag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gastrotag_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gastrotag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gastrotag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gastrotag_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-gastrotag}:${POSTGRES_PASSWORD:-gastrotag_secret}@db:5432/${POSTGRES_DB:-gastrotag}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_32chars}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  # ── Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
    container_name: gastrotag_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
