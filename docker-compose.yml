services:
  db:
    image: postgres:16-alpine
    container_name: gastrotag_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gastrotag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-gastrotag}
      TZ: America/Manaus
      KITCHEN_TIME_ZONE: ${KITCHEN_TIME_ZONE:-America/Manaus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gastrotag} -d ${POSTGRES_DB:-gastrotag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gastrotag_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      TZ: America/Manaus
      KITCHEN_TIME_ZONE: ${KITCHEN_TIME_ZONE:-America/Manaus}
      CAP_DISCARD_TO_ORIGINAL_EXPIRY: ${CAP_DISCARD_TO_ORIGINAL_EXPIRY:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gastrotag}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:-gastrotag}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Defina JWT_ACCESS_SECRET no arquivo .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Defina JWT_REFRESH_SECRET no arquivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    container_name: gastrotag_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
