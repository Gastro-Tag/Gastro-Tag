services:
  db:
    image: postgres:16-alpine
    container_name: gastrotag_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gastrotag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-gastrotag}
      TZ: America/Manaus
      KITCHEN_TIME_ZONE: ${KITCHEN_TIME_ZONE:-America/Manaus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gastrotag} -d ${POSTGRES_DB:-gastrotag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gastrotag_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      TZ: America/Manaus
      KITCHEN_TIME_ZONE: ${KITCHEN_TIME_ZONE:-America/Manaus}
      CAP_DISCARD_TO_ORIGINAL_EXPIRY: ${CAP_DISCARD_TO_ORIGINAL_EXPIRY:-true}
      TRUST_PROXY_HOPS: 1
      DATABASE_URL: postgresql://${POSTGRES_USER:-gastrotag}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:-gastrotag}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Defina JWT_ACCESS_SECRET no arquivo .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Defina JWT_REFRESH_SECRET no arquivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      MAX_BACKDATE_DAYS: ${MAX_BACKDATE_DAYS:-2}
    depends_on:
      db:
        condition: service_healthy
    # /health confere o banco. start_period cobre o "prisma migrate deploy" antes de a API subir.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    container_name: gastrotag_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
